name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ohmycoin_test
          MYSQL_USER: ohmycoin_test
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      TESTING: "True"
      FLASK_DEBUG: "False"
      SECRET_KEY: test-secret-key-with-at-least-thirty-two-characters
      SESSION_COOKIE_SECURE: "False"
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ohmycoin_test
      DB_PASSWORD: test_password
      DB_NAME: ohmycoin_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app config.py database.py run.py

      - name: Lint
        run: ruff check app tests unit_tests scripts config.py database.py run.py

      - name: Public source tree check
        run: python scripts/check_public_tree.py

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Security scan
        run: bandit -q -r app config.py database.py

      - name: Dependency audit
        run: pip-audit -r requirements.txt


  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start fictional demo
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 180
      - name: Test demo login and populated pages over HTTP
        run: |
          python scripts/smoke_demo.py
          docker compose exec -T web python -c "import os; assert not os.getenv('MYSQL_ROOT_PASSWORD')"
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Check desktop and mobile rendering
        run: python scripts/browser_smoke.py
      - name: Save demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-screenshots
          path: browser-artifacts/
          retention-days: 7
      - name: Restart preserves demo data
        run: |
          docker compose restart web
          docker compose up -d --wait --wait-timeout 120
          python scripts/smoke_demo.py
      - name: Diagnose disposable environment
        if: failure()
        run: docker compose logs --no-color --tail=100 web db
      - name: Remove disposable environment
        if: always()
        run: docker compose down -v
